[theme]
base = "light"
primaryColor = "#2E6F40"
backgroundColor = "#E6F5EA"
secondaryBackgroundColor = "#D8EEDF"
textColor = "#1B2E21"
borderColor = "#C9E3D0"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"
baseRadius = "10px"

[theme.sidebar]
backgroundColor = "#253D2C"
secondaryBackgroundColor = "#2E4A37"
textColor = "#E8F5EC"
primaryColor = "#68BA7F"
borderColor = "#345242"

[server]
headless = true

[browser]
gatherUsageStats = false
